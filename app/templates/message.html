<link rel="stylesheet" href="/static/css/app.css"></head><body><div style="max-width:560px;margin:14vh auto;padding:0 20px">
<div class="panel"><div class="body"><h1 style="margin-bottom:8px">{{ title }}</h1><p>{{ text }}</p></div></div></div></body></html>
{% else %}{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="panel" style="max-width:640px"><div class="body"><p style="margin-top:0">{{ text }}</p>
